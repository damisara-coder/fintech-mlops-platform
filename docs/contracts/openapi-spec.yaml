openapi: 3.0.3
info:
  title: FinTech MLOps Platform API Specification
  description: Spécification officielle et figée des APIs de la plateforme FinTech MLOps (Contrat v1.2 - Support 29 features ULB anonymisées).
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: API Gateway Locale
  - url: https://api.fintech-mlops.internal
    description: Ingress Kubernetes

paths:
  # =========================================================================
  # AUTHENTIFICATION & UTILISATEURS
  # =========================================================================
  /api/v1/auth/login:
    post:
      summary: Authentification et obtention du token JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email:
                  type: string
                  example: "amina@bank-fintech.com"
                username:
                  type: string
                  example: "amina@bank-fintech.com"
                password:
                  type: string
                  example: "Secr3tPassword!"
                organization:
                  type: string
                  example: "Risk Operations"
      responses:
        '200':
          description: Authentification réussie avec profil utilisateur complet
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refresh_token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  role:
                    type: string
                    enum: [ANALYST, RISK_OPS, DEV, ADMIN]
                    example: "ANALYST"
                  name:
                    type: string
                    example: "Amina"
                  email:
                    type: string
                    example: "amina@bank-fintech.com"
                  organization:
                    type: string
                    example: "Risk Operations"
                  expires_in:
                    type: integer
                    example: 3600
        '401':
          description: Identifiants invalides

  /api/v1/auth/refresh:
    post:
      summary: Rafraîchissement du jeton d'accès via le refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Nouveau token d'accès généré
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refresh_token:
                    type: string
                  role:
                    type: string
                  email:
                    type: string
                  organization:
                    type: string
                  expires_in:
                    type: integer
        '401':
          description: Refresh token invalide ou expiré

  # =========================================================================
  # TRANSACTIONS BANCAIRES & SIMULATEUR
  # =========================================================================
  /api/v1/transactions:
    post:
      summary: Soumission d'une nouvelle transaction bancaire (Flux Asynchrone de Production)
      tags: [Transactions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, amount, currency, channel, merchant_category, ip_address]
              properties:
                account_id:
                  type: string
                  example: "ACC-5521"
                amount:
                  type: number
                  example: 550.00
                currency:
                  type: string
                  example: "EUR"
                channel:
                  type: string
                  enum: [card, wire, sepa]
                  example: "card"
                merchant_category:
                  type: string
                  example: "electronics_new"
                merchant_name:
                  type: string
                  example: "ElectroShop Paris"
                ip_address:
                  type: string
                  example: "194.22.10.5"
                features:
                  type: object
                  description: "29 variables numériques (V1..V28 + Amount) transmises au modèle ML"
                  additionalProperties:
                    type: number
                  example:
                    Amount: 550.00
                    V1: -1.3598
                    V14: -0.3111
      responses:
        '202':
          description: Transaction enregistrée immédiatement en statut PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  tx_id:
                    type: string
                    example: "TX-9F219"
                  status:
                    type: string
                    example: "PENDING"
                  message:
                    type: string
                    example: "Transaction enregistrée et en cours d'évaluation de risque"

    get:
      summary: Liste des transactions récentes pour le flux historique
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Liste des transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionItem'

  /api/v1/transactions/{id}:
    get:
      summary: Consultation du statut et détails d'une transaction par son ID
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détail complet de la transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '404':
          description: Transaction non trouvée

  /api/v1/transactions/simulate:
    post:
      summary: Simulateur de paiement synchrone (Maquette 6 - Idéal pour la démo)
      tags: [Transactions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  type: string
                  enum: [normal, fraud, uncertain, custom]
                  example: "uncertain"
                amount:
                  type: number
                  example: 550.00
                currency:
                  type: string
                  example: "EUR"
                country:
                  type: string
                  example: "ES"
                merchant_category:
                  type: string
                  example: "electronics_new"
                features:
                  type: object
                  description: "29 variables numériques (V1..V28 + Amount) personnalisées"
                  additionalProperties:
                    type: number
      responses:
        '200':
          description: Résultat synchrone immédiat traversant toute la chaîne technique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'

  # =========================================================================
  # HUMAN REVIEW QUEUE (MAQUETTE 3 - ÉCRAN CENTRAL)
  # =========================================================================
  /api/v1/transactions/human-review:
    get:
      summary: File d'attente Human Review complète (Maquette 3 - Triée par incertitude décroissante)
      tags: [Human Review]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste enrichie des transactions en attente avec contexte client, modèle et explicabilité SHAP
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HumanReviewItem'

  /api/v1/transactions/{id}/review:
    post:
      summary: Trancher une transaction en revue humaine (Approuver / Rejeter / Escalader)
      tags: [Human Review]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REJECTED, ESCALATED]
                  example: "APPROVED"
                comment:
                  type: string
                  example: "Vérification client effectuée, historique sans incident."
      responses:
        '200':
          description: Décision enregistrée dans le journal immuable et labelisée pour le ré-entraînement
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "SUCCESS"
                  tx_id:
                    type: string
                    example: "TX-9F219"
                  final_decision:
                    type: string
                    example: "APPROVED"
                  audit_id:
                    type: string
                    example: "a-88213"

  # =========================================================================
  # DASHBOARD & KPIS (MAQUETTE 2)
  # =========================================================================
  /api/v1/dashboard/kpis:
    get:
      summary: Les 5 indicateurs clés du haut du Dashboard (Maquette 2)
      tags: [Dashboard]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: KPIs temps réel sur 24h
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardKpis'

  # =========================================================================
  # SYSTEM HEALTH & OBSERVABILITÉ (MAQUETTE 5)
  # =========================================================================
  /api/v1/system/health:
    get:
      summary: État de santé du cluster, pods, scaling HPA et Model Registry (Maquette 5)
      tags: [System Health]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métriques agrégées pour la console SRE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthData'

  # =========================================================================
  # ML ANALYTICS & EXPLICABILITÉ (MAQUETTE 4 - PROFIL 2)
  # =========================================================================
  /api/v1/analytics/umap:
    get:
      summary: Coordonnées 2D/3D UMAP/PCA des 8 000 points du dataset (généré par P2)
      tags: [ML Analytics]
      responses:
        '200':
          description: Nuage de points interactif avec clusters légitimes, fraude et zone d'incertitude
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_points:
                    type: integer
                    example: 8000
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        x: { type: number }
                        y: { type: number }
                        label: { type: string, enum: [legitimate, fraud, uncertain] }
                        tx_id: { type: string }

  /api/v1/analytics/benchmark:
    get:
      summary: Résultats comparatifs des 5 modèles ML et tests statistiques (P2)
      tags: [ML Analytics]
      responses:
        '200':
          description: Tableau benchmark (ROC-AUC, PR-AUC, F1, MCC, latence) et p-values (Friedman/Wilcoxon)
          content:
            application/json:
              schema:
                type: object

  # =========================================================================
  # AUDIT SERVICE (JOURNAL IMMUABLE SHA-256)
  # =========================================================================
  /api/v1/audit/{txId}:
    get:
      summary: Traçabilité réglementaire et preuve de hash chaîné
      tags: [Audit]
      parameters:
        - name: txId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enregistrement d'audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_id: { type: string, example: "a-88213" }
                  tx_id: { type: string, example: "TX-9F219" }
                  previous_hash: { type: string }
                  current_hash: { type: string }
                  event_type: { type: string }
                  timestamp: { type: string, format: date-time }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DashboardKpis:
      type: object
      properties:
        transactions_24h: { type: integer, example: 184392 }
        transactions_trend: { type: string, example: "+4.2% vs hier" }
        blocked_fraud: { type: integer, example: 1204 }
        blocked_ratio: { type: string, example: "0.65% du volume" }
        human_review_queue: { type: integer, example: 318 }
        human_review_trend: { type: string, example: "+41 en 1h" }
        ml_latency_p95: { type: integer, example: 42 }
        ml_latency_target: { type: integer, example: 50 }
        pods_running: { type: string, example: "14/14" }
        hpa_status: { type: string, example: "min 4 -> max 12 (actif)" }

    TransactionItem:
      type: object
      properties:
        id: { type: string, example: "TX-9F219" }
        amount: { type: number, example: 550.00 }
        currency: { type: string, example: "EUR" }
        channel: { type: string, example: "card" }
        merchant_name: { type: string, example: "ElectroShop" }
        status: { type: string, example: "PENDING" }
        created_at: { type: string, format: date-time }

    TransactionDetail:
      type: object
      properties:
        id: { type: string, example: "TX-9F219" }
        account_id: { type: string, example: "ACC-5521" }
        amount: { type: number, example: 550.00 }
        currency: { type: string, example: "EUR" }
        channel: { type: string, example: "card" }
        merchant_name: { type: string, example: "ElectroShop" }
        merchant_category: { type: string, example: "electronics_new" }
        ip_address: { type: string, example: "194.22.10.5" }
        features:
          type: object
          description: "29 features numériques (V1..V28 + Amount)"
          additionalProperties: { type: number }
        status: { type: string, example: "EVALUATED" }
        decision: { type: string, example: "HUMAN_REVIEW" }
        created_at: { type: string, format: date-time }

    SimulationResult:
      type: object
      properties:
        tx_id: { type: string, example: "TX-9F219" }
        status: { type: string, example: "HUMAN_REVIEW" }
        probability: { type: number, example: 0.52 }
        uncertainty_score: { type: number, example: 0.34 }
        is_uncertain: { type: boolean, example: true }
        conformal_interval:
          type: array
          items: { type: number }
          example: [0.48, 0.56]
        model_version: { type: string, example: "v4.2" }
        latency_ms: { type: integer, example: 38 }
        audit_id: { type: string, example: "a-88213" }

    HumanReviewItem:
      type: object
      required: [tx_id, client, transaction, model_evaluation, shap_factors]
      properties:
        tx_id: { type: string, example: "TX-9F219" }
        client:
          type: object
          properties:
            id: { type: string, example: "CUST-10428" }
            name: { type: string, example: "L. Benali" }
            account_age_days: { type: integer, example: 2190 }
            total_transactions: { type: integer, example: 214 }
            fraud_history: { type: integer, example: 0 }
            confidence_score: { type: number, example: 0.99 }
        transaction:
          type: object
          properties:
            amount: { type: number, example: 550.00 }
            currency: { type: string, example: "EUR" }
            channel: { type: string, example: "Card : ES (new)" }
            merchant_category: { type: string, example: "electronics_new" }
            country: { type: string, example: "ES" }
            hour: { type: integer, example: 3 }
            is_recurring_merchant: { type: boolean, example: false }
            three_d_secure_passed: { type: boolean, example: true }
            features:
              type: object
              description: "29 features numériques (V1..V28 + Amount)"
              additionalProperties: { type: number }
            created_at: { type: string, format: date-time }
        model_evaluation:
          type: object
          properties:
            decision: { type: string, enum: [APPROVED, BLOCKED, HUMAN_REVIEW], example: "HUMAN_REVIEW" }
            predicted_class: { type: string, example: "FRAUDE" }
            probability: { type: number, example: 0.52 }
            uncertainty_score: { type: number, example: 0.34 }
            conformal_interval:
              type: array
              items: { type: number }
              example: [0.48, 0.56]
            model_version: { type: string, example: "v4.2" }
        shap_factors:
          type: array
          items:
            type: object
            properties:
              feature: { type: string, example: "V14 = -0.3111" }
              contribution: { type: number, example: 0.31 }
              type: { type: string, enum: [fraud_risk, safe, neutral], example: "fraud_risk" }
        queue_sla_remaining_minutes: { type: integer, example: 4 }

    SystemHealthData:
      type: object
      properties:
        api_gateway_rps: { type: integer, example: 1842 }
        p95_latency_ms: { type: integer, example: 118 }
        error_rate: { type: number, example: 0.003 }
        replicas_active: { type: integer, example: 6 }
        ml_latency_ms: { type: integer, example: 38 }
        model_active_version: { type: string, example: "v4.2" }
        pods:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: "risk-service-7d9f4c-4bk2p" }
              ready: { type: string, example: "2/2 Running" }
              status: { type: string, example: "Ready" }
        hpa_events:
          type: array
          items:
            type: object
            properties:
              event: { type: string, example: "ScaleUp risk-service 4->6 replicas (CPU 78% > target 60%)" }
              timestamp: { type: string }
